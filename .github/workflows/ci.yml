name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_pass
          POSTGRES_DB: amrutam
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://amrutam_user:amrutam_pass@localhost:5432/amrutam
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate:up

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true # abhi warn-only; production mein isko blocking bana sakte ho

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t amrutam-backend:ci ./backend