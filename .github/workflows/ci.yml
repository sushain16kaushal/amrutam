name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_pass
          POSTGRES_DB: amrutam
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://amrutam_user:amrutam_pass@localhost:5432/amrutam
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-prod
      RESEND_API_KEY: re_ci_test_dummy_key_not_for_production
      GROQ_API_KEY: gsk_ci_test_dummy_key_not_for_production
      NODE_ENV: test
      # npm ke apne network fetches (registry tarball download) ke liye retry/timeout —
      # `npm ci` step ke apne bash-level retry loop se alag hai (woh sharp jaisे
      # postinstall scripts ke direct GitHub download failures cover karta hai, yeh wala
      # npm ke registry-level fetches cover karta hai).
      npm_config_fetch_retries: 5
      npm_config_fetch_retry_mintimeout: 20000
      npm_config_fetch_retry_maxtimeout: 120000
      npm_config_fetch_timeout: 300000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install libvips (avoids sharp's GitHub binary download)
        # sharp (via @xenova/transformers) normally fetches a prebuilt libvips
        # binary from GitHub Releases during npm install, which has been failing
        # with "socket hang up" even across retries. Installing libvips from apt
        # lets sharp link against the system library instead and skip that
        # download entirely (see https://sharp.pixelplumbing.com/install#custom-libvips).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Install dependencies
        # Kept as a fallback safety net in case some other transient npm registry
        # flake shows up — the libvips install above should already prevent the
        # sharp-specific GitHub download failure.
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt"
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed on attempt $attempt, retrying..."
            rm -rf node_modules
            sleep $((attempt * 10))
          done
          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Run migrations
        run: npm run migrate:up

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true # abhi warn-only; production mein isko blocking bana sakte ho

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t amrutam-backend:ci ./backend